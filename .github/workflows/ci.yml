name: Release

on:
  push:
    branches:
    - master
    tags:
      - "v*"
    # Docs-only pushes skip CI. Tag pushes always run: GitHub does not
    # evaluate path filters for tags, so releases are never skipped.
    paths-ignore:
      - "**.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
          - name: macos-15
            runner: macos-15
          - name: windows-2025-vs2026
            runner: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite
        run: cargo test --all-targets --locked

  prepare-release:
    name: Prepare release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure GitHub draft release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --verify-tag --title "$tag" --generate-notes --draft
          fi

  build-release:
    name: Build (${{ matrix.name }})
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: bfiles
            asset_suffix: linux-x86_64
            archive_extension: tar.gz

          # Static musl build so the same binary runs on any 64-bit distro
          # (Raspberry Pi OS Bookworm/Trixie, Ubuntu, DietPi) regardless of
          # glibc version.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_name: bfiles
            asset_suffix: linux-aarch64
            archive_extension: tar.gz

          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary_name: bfiles
            asset_suffix: macos-arm64
            archive_extension: tar.gz

          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: bfiles
            asset_suffix: macos-x86_64
            archive_extension: tar.gz

          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary_name: bfiles.exe
            asset_suffix: windows-x86_64
            archive_extension: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          asset_name="bfiles-${{ matrix.asset_suffix }}.tar.gz"
          staging_dir="dist/stage"
          binary_path="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          test -f "$binary_path"

          rm -rf dist
          mkdir -p "$staging_dir"

          cp "$binary_path" "$staging_dir/"
          chmod +x "$staging_dir/${{ matrix.binary_name }}"

          members="${{ matrix.binary_name }}"
          if [ -f README.md ]; then
            cp README.md "$staging_dir/"
            members="$members README.md"
          fi

          # The binary must sit at the archive root: `bfiles upgrade`
          # (self_update) only extracts an entry named exactly "bfiles".
          # This also matches the Windows zip, which was already flat.
          tar -C "$staging_dir" -czf "dist/${asset_name}" $members

          test -f "dist/${asset_name}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $archiveRoot = "bfiles-$tag-${{ matrix.asset_suffix }}"
          $assetName = "bfiles-${{ matrix.asset_suffix }}.zip"
          $stagingDir = Join-Path "dist" $archiveRoot
          $binaryPath = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          if (!(Test-Path $binaryPath)) {
            throw "Binary was not found at $binaryPath"
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          Copy-Item $binaryPath $stagingDir

          if (Test-Path "README.md") {
            Copy-Item README.md $stagingDir
          }

          Compress-Archive -Path "$stagingDir/*" -DestinationPath "dist/$assetName" -Force

          if (!(Test-Path "dist/$assetName")) {
            throw "Archive was not created at dist/$assetName"
          }

      - name: Upload release asset (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare-release.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"
          asset_name="bfiles-${{ matrix.asset_suffix }}.tar.gz"

          gh release upload "$tag" "dist/${asset_name}" --repo "$repo" --clobber

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $repo = $env:GITHUB_REPOSITORY
          $assetName = "bfiles-${{ matrix.asset_suffix }}.zip"

          gh release upload $tag "dist/$assetName" --repo $repo --clobber

  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare-release.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"

          gh release edit "$tag" --repo "$repo" --draft=false --latest=true